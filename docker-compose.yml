version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: usability_dashboard_postgres
    environment:
      POSTGRES_DB: UsabilityDashboardDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d UsabilityDashboardDb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - dashboard_network

  # .NET API Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: usability_dashboard_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=UsabilityDashboardDb;Username=postgres;Password=postgres
      - DATABASE_SEED=true
    ports:
      - "5062:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger/index.html"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - dashboard_network

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: usability_dashboard_frontend
    ports:
      - "5000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - dashboard_network

volumes:
  postgres_data:
    driver: local

networks:
  dashboard_network:
    driver: bridge
